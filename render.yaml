services:
  - type: web
    name: paragraph-quality-analyzer
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: gunicorn app:app --workers=1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MAX_UPLOAD_SIZE
        value: 10M
    scaling:
      minInstances: 1
      maxInstances: 1
      targetMemoryPercent: 80
